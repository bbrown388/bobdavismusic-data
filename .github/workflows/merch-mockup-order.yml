# Keeps merch/image-order.json in step with whatever Printful has published.
#
# Scheduled rather than push triggered on purpose: the thing that goes stale is Shopify's
# image set, which changes when Printful republishes a product. That never coincides with
# a commit to this repo, so a push trigger would almost never fire at the right moment.
#
# Safe to run unattended. The tool only rewrites a product's order when the order actually
# varies across colours AND the photo matching is confident, and merch.html falls back to
# its own sort for any image the map does not cover.

name: Merch mockup order

on:
  schedule:
    # 08:20 UTC daily, a little after the follower refresh so the two never race.
    - cron: '20 8 * * *'
  workflow_dispatch:
  push:
    # Re-run when the tool itself changes, to catch a bad edit immediately.
    paths:
      - 'tools/merch-mockup-order/**'
      - '.github/workflows/merch-mockup-order.yml'

permissions:
  contents: write

concurrency:
  group: merch-mockup-order
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet numpy pillow

      # Fingerprints are keyed by image URL, so a restored cache means only genuinely new
      # mockups get downloaded. Saves roughly 300 image fetches per run.
      - uses: actions/cache@v4
        with:
          path: tools/merch-mockup-order/.sigcache
          key: sigcache-${{ github.run_id }}
          restore-keys: sigcache-

      - name: Regenerate the order map
        run: python tools/merch-mockup-order/mockup_order.py --write

      - name: Commit if the order actually changed
        run: |
          if git diff --quiet -- merch/image-order.json; then
            echo "No drift. Nothing to commit."
            echo "No drift; map already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merch/image-order.json
          git commit -m "chore(merch): refresh canonical mockup order

          Printful republished mockups, so the canonical positions were recomputed.
          Generated by tools/merch-mockup-order."
          git push
          echo "CHANGED=1" >> "$GITHUB_ENV"
          echo "Committed a refreshed order map." >> "$GITHUB_STEP_SUMMARY"

      # Only pings when something actually changed, so the known twill cap gap does not
      # turn into a daily notification. Skipped entirely if the secret is not set.
      - name: Notify
        if: env.CHANGED == '1' && secrets.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS \
            -H "Title: Merch mockup order refreshed" \
            -H "Tags: shopping_cart" \
            -d "Printful republished mockups. image-order.json was regenerated and pushed; the shop picks it up within a minute." \
            "https://ntfy.sh/$NTFY_TOPIC" || echo "notify failed, not fatal"
